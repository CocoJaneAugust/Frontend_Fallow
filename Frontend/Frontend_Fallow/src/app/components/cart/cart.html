<app-navbar></app-navbar>

<div class="bg-[#FDFCFB] min-h-screen font-minimal">
  <main class="max-w-4xl mx-auto px-6 py-16">
    <h2 class="text-3xl font-light uppercase tracking-widest mb-12 border-b border-[#E5E0D8] pb-6 text-[#3D322A]">
      Tu Carrito
    </h2>

    @if (items.length > 0) {
      <div class="space-y-8">
        @for (item of items; track $index) {
          <div class="flex items-center justify-between border-b border-[#F5F2EE] py-8">
            <div class="flex items-center space-x-6">
              <div class="bg-[#F5F2EE] w-24 h-32 overflow-hidden border border-[#E5E0D8]">
                <img [src]="item.imagen_url" class="w-full h-full object-cover">
              </div>
              
              <div class="space-y-1">
                <h3 class="text-sm font-medium uppercase tracking-wider text-[#3D322A]">{{ item.nombre }}</h3>
                <p class="text-[10px] text-[#A69586] uppercase tracking-widest">{{ item.marca }} • Talla {{ item.talla }}</p>
                
                <button (click)="eliminarItem($index)" 
                        class="text-[9px] uppercase tracking-[0.2em] text-[#8C7B70] hover:text-[#3D322A] transition-colors mt-4 flex items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3 mr-1">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                  </svg>
                  Quitar
                </button>
              </div>
            </div>
            <p class="text-sm font-bold text-[#3D322A]">${{ item.precio }}</p>
          </div>
        }

        <div class="pt-8 flex flex-col items-end space-y-4">
          <div class="flex justify-between w-full md:w-72 text-[11px] uppercase tracking-widest text-[#8C7B70]">
            <span>Subtotal</span>
            <span class="font-bold text-[#3D322A]">${{ total }}</span>
          </div>
          <div class="flex justify-between w-full md:w-72 text-[11px] uppercase tracking-widest text-[#A69586]">
            <span>Envío</span>
            <span class="font-bold text-[#5C4D42]">Gratis</span>
          </div>
          <div class="flex justify-between w-full md:w-72 text-xl border-t border-[#3D322A] pt-4 uppercase tracking-[0.2em] text-[#3D322A]">
            <span class="font-light">Total</span>
            <span class="font-bold">${{ total }}</span>
          </div>

          <div class="w-full md:w-72 pt-6">
            <button (click)="finalizarCompra()" 
                    class="group relative w-full py-5 bg-[#F5F2EE] text-[#3D322A] overflow-hidden transition-all duration-300 border border-[#E5E0D8] shadow-sm">
              <span class="relative z-10 text-[10px] uppercase tracking-[0.4em] font-bold group-hover:text-white transition-colors duration-300">
                Finalizar Compra
              </span>
              <div class="absolute inset-0 bg-[#3D322A] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
          </div>
        </div>
      </div>
    } @else {
      <div class="text-center py-20 space-y-8">
        <p class="text-[#A69586] uppercase tracking-[0.3em] text-sm">Tu carrito está vacío</p>
        <button routerLink="/home" 
                class="group relative inline-block px-10 py-4 bg-[#F5F2EE] text-[#3D322A] uppercase text-[10px] tracking-[0.3em] font-semibold border border-[#E5E0D8] overflow-hidden">
          <span class="relative z-10 group-hover:text-[#F5F2EE] transition-colors">Volver a la tienda</span>
          <div class="absolute inset-0 bg-[#3D322A] translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        </button>
      </div>
    }
  </main>
</div>

<app-footer></app-footer>

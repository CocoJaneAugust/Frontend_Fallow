<div class="min-h-screen bg-[#F5F2EE] py-12 px-6 font-minimal">
  <div class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12">
    
    <div class="lg:col-span-7 bg-white border border-[#E5E0D8] p-8 shadow-sm rounded-sm">
      <h2 class="text-xl font-light tracking-[0.3em] uppercase text-[#3D322A] mb-8">Detalles de Envío y Pago</h2>
      
      <form (submit)="procesarCompra()" class="space-y-8">
        <div class="space-y-4">
          <h3 class="text-[11px] uppercase tracking-[0.2em] text-[#8C7B70] font-bold border-b border-[#E5E0D8] pb-2">1. Dirección de Entrega</h3>
          
          <div>
            <label class="block text-[9px] uppercase tracking-[0.2em] text-[#8C7B70] mb-1">Calle y Número</label>
            <input type="text" [(ngModel)]="datosEnvio.direccion" name="direccion" required placeholder="Av. Universidad #123"
              class="w-full bg-[#FAF9F8] border-b border-[#E5E0D8] py-3 px-4 text-xs focus:outline-none focus:border-[#3D322A] text-[#3D322A]">
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-[9px] uppercase tracking-[0.2em] text-[#8C7B70] mb-1">Ciudad</label>
              <input type="text" [(ngModel)]="datosEnvio.ciudad" name="ciudad" required placeholder="La Piedad"
                class="w-full bg-[#FAF9F8] border-b border-[#E5E0D8] py-3 px-4 text-xs focus:outline-none focus:border-[#3D322A] text-[#3D322A]">
            </div>
            <div>
              <label class="block text-[9px] uppercase tracking-[0.2em] text-[#8C7B70] mb-1">Código Postal</label>
              <input type="text" [(ngModel)]="datosEnvio.cp" name="cp" required placeholder="59300"
                class="w-full bg-[#FAF9F8] border-b border-[#E5E0D8] py-3 px-4 text-xs focus:outline-none focus:border-[#3D322A] text-[#3D322A]">
            </div>
          </div>
        </div>

        <div class="space-y-4 pt-4">
          <h3 class="text-[11px] uppercase tracking-[0.2em] text-[#8C7B70] font-bold border-b border-[#E5E0D8] pb-2">2. Método de Pago</h3>
          
          <div class="grid grid-cols-2 gap-4">
            <label class="border p-4 flex items-center justify-between cursor-pointer rounded-sm transition-all"
              [ngClass]="datosEnvio.tipo_pago === 'debito' ? 'border-[#3D322A] bg-[#F5F2EE]/50' : 'border-[#E5E0D8] bg-[#FAF9F8]'">
              <div class="flex items-center space-x-3">
                <input type="radio" [(ngModel)]="datosEnvio.tipo_pago" name="tipo_pago" value="debito" required class="accent-[#3D322A]">
                <span class="text-[10px] uppercase tracking-widest font-semibold text-[#3D322A]">Tarjeta Débito</span>
              </div>
            </label>

            <label class="border p-4 flex items-center justify-between cursor-pointer rounded-sm transition-all"
              [ngClass]="datosEnvio.tipo_pago === 'credito' ? 'border-[#3D322A] bg-[#F5F2EE]/50' : 'border-[#E5E0D8] bg-[#FAF9F8]'">
              <div class="flex items-center space-x-3">
                <input type="radio" [(ngModel)]="datosEnvio.tipo_pago" name="tipo_pago" value="credito" required class="accent-[#3D322A]">
                <span class="text-[10px] uppercase tracking-widest font-semibold text-[#3D322A]">Tarjeta Crédito</span>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" 
          class="w-full bg-[#3D322A] text-[#F5F2EE] py-4 text-[10px] uppercase tracking-[0.3em] font-bold hover:bg-[#5C4D42] transition-colors pt-4 shadow-sm">
          Confirmar y Pagar
        </button>
      </form>
    </div>

    <div class="lg:col-span-5 bg-[#FAF9F8] border border-[#E5E0D8] p-8 h-fit rounded-sm">
      <h2 class="text-xs font-bold tracking-[0.2em] uppercase text-[#3D322A] mb-6 border-b border-[#E5E0D8] pb-3">Resumen del Pedido</h2>
      
      <div class="space-y-4 max-h-60 overflow-y-auto mb-6 pr-2">
        @for (item of itemsCarrito; track item.id) {
          <div class="flex justify-between items-center text-xs">
            <span class="text-[#5C4D42] uppercase tracking-wider font-light">{{ item.nombre }} (x{{ item.cantidad }})</span>
            <span class="text-[#3D322A] font-semibold">${{ item.precio * item.cantidad | number:'1.2-2' }}</span>
          </div>
        }
      </div>

      <div class="border-t border-[#E5E0D8] pt-4 space-y-2">
        <div class="flex justify-between text-xs">
          <span class="text-[#8C7B70] uppercase tracking-wider">Envío</span>
          <span class="text-[#3D322A] uppercase tracking-wider font-medium text-[10px]">Gratis</span>
        </div>
        <div class="flex justify-between text-base pt-2 border-t border-[#E5E0D8]/60">
          <span class="text-[#3D322A] uppercase tracking-[0.1em] font-light">Total</span>
          <span class="text-[#3D322A] font-bold">${{ totalCompra | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>

  </div>
</div>

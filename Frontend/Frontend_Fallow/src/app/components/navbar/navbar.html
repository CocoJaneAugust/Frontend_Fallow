<nav class="bg-[#F5F2EE] sticky top-0 z-50 border-b border-[#E5E0D8] font-minimal">
  <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
    
    <div class="hidden md:flex items-center space-x-10">
      
      <div class="group relative py-8">
        <a [routerLink]="['/home']" [queryParams]="{ cat: 'dama' }" 
           class="text-[11px] uppercase tracking-[0.3em] text-[#5C4D42] group-hover:text-[#3D322A] transition-colors font-medium">
          Dama
        </a>
        <div class="absolute left-0 top-[90%] w-52 bg-[#F5F2EE]/80 backdrop-blur-md border border-[#E5E0D8] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-y-2 transition-all duration-500 ease-out z-50 overflow-hidden">
          <div class="h-[2px] w-full bg-[#3D322A]/20"></div>
          <ul class="p-6 space-y-5">
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'dama', sub: 'chaquetas' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Chaquetas
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'dama', sub: 'vestidos' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Vestidos
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'dama', sub: 'accesorios' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Accesorios
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="group relative py-8">
        <a [routerLink]="['/home']" [queryParams]="{ cat: 'caballero' }" 
           class="text-[11px] uppercase tracking-[0.3em] text-[#5C4D42] group-hover:text-[#3D322A] transition-colors font-medium">
          Caballero
        </a>
        <div class="absolute left-0 top-[90%] w-52 bg-[#F5F2EE]/80 backdrop-blur-md border border-[#E5E0D8] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-y-2 transition-all duration-500 ease-out z-50 overflow-hidden">
          <div class="h-[2px] w-full bg-[#3D322A]/20"></div>
          <ul class="p-6 space-y-5">
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'caballero', sub: 'camisas' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Camisas
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'caballero', sub: 'pantalones' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Pantalones
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
            <li>
              <a [routerLink]="['/home']" [queryParams]="{ cat: 'caballero', sub: 'calzado' }" 
                 class="group/sub relative inline-block text-[10px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-1">
                Calzado
                <span class="absolute left-1/2 -bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-500 -translate-x-1/2 group-hover/sub:w-full"></span>
              </a>
            </li>
          </ul>
        </div>
      </div>

      <a [routerLink]="['/home']" class="text-[11px] uppercase tracking-[0.3em] text-[#5C4D42] hover:text-[#3D322A] transition-colors font-medium">
        Todo
      </a>
    </div>

    <div class="absolute left-1/2 transform -translate-x-1/2 flex flex-col items-center group cursor-pointer" routerLink="/home">
      <div class="text-3xl font-light tracking-[0.5em] uppercase text-[#3D322A]">Fallow</div>
      <div class="text-[7px] tracking-[0.4em] uppercase text-[#8C7B70] -mt-1 font-semibold">Ropa de segunda mano</div>
    </div>

    <div class="flex items-center space-x-6 text-[#5C4D42]">
      
      @if (estaLogueado) {
        <div class="hidden md:flex flex-col items-end leading-tight border-r border-[#E5E0D8] pr-6 h-8 justify-center">
          <span class="text-[7px] uppercase tracking-[0.3em] text-[#8C7B70] mb-0.5">{{ saludo }}</span>
          <span class="text-[9px] uppercase tracking-[0.1em] text-[#3D322A] font-bold">{{ nombreUsuario }}</span>
        </div>
      }

      <div class="hidden lg:flex items-center border-b border-[#E5E0D8] px-2 py-1 focus-within:border-[#3D322A] transition-colors">
        <input type="text" [(ngModel)]="terminoBusqueda" (keyup.enter)="buscar()" placeholder="BUSCAR..."
          class="bg-transparent border-none text-[9px] tracking-[0.2em] uppercase focus:outline-none w-24 placeholder-[#A69586] text-[#3D322A]">
        <button (click)="buscar()" class="hover:text-[#3D322A] transition-colors ml-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="w-4 h-4">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </button>
      </div>

      <div class="flex items-center space-x-5">
        <button routerLink="/carrito" class="relative hover:text-[#3D322A] transition-all hover:scale-105">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
          </svg>
          @if (cantidadCarrito > 0) {
            <span class="absolute -top-1 -right-1.5 bg-[#3D322A] text-white text-[6px] w-3 h-3 flex items-center justify-center rounded-full font-bold shadow-sm">
              {{ cantidadCarrito }}
            </span>
          }
        </button>

        @if (estaLogueado) {
          <button (click)="cerrarSesion()" class="hover:text-[#8C7B70] transition-all hover:scale-105" title="Cerrar Sesión">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
            </svg>
          </button>
        } @else {
          <div class="group relative py-2">
            <button class="hover:text-[#3D322A] transition-all hover:scale-105 flex items-center">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
            </button>

            <div class="absolute right-0 top-[110%] w-48 bg-[#F5F2EE]/90 backdrop-blur-md border border-[#E5E0D8] shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-y-1 transition-all duration-300 ease-out z-50 overflow-hidden rounded-sm">
              <div class="h-[2px] w-full bg-[#3D322A]/20"></div>
              <ul class="p-4 space-y-4 text-left">
                <li>
                  <a routerLink="/login" 
                     class="group/item relative inline-block text-[9px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-0.5">
                    Ingresar
                    <span class="absolute left-0 bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-300 group-hover/item:w-full"></span>
                  </a>
                </li>
                <li>
                  <a routerLink="/register" 
                     class="group/item relative inline-block text-[9px] uppercase tracking-[0.2em] text-[#5C4D42] hover:text-[#3D322A] transition-colors duration-300 pb-0.5">
                    Crear Cuenta
                    <span class="absolute left-0 bottom-0 w-0 h-[1px] bg-[#3D322A] transition-all duration-300 group-hover/item:w-full"></span>
                  </a>
                </li>
              </ul>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</nav>
